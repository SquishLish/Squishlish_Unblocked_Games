
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stickman Hook | Squishlish's Unblocked Games</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111126;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            background: #1c1b35;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #34314e;
        }

        .logo {
            color: #a78bfa;
            font-size: 21px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            display: inline-block;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        nav a:hover {
            color: #a78bfa;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 35px 20px;
        }

        .game-controls {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 12px;
        }

        .fullscreen-btn {
            background: #7954db;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
        }

        .fullscreen-btn:hover {
            background: #9273ed;
        }

        .game-window {
            width: 100%;
            background: black;
            border-radius: 12px;
            overflow: hidden;
        }

        .game-iframe {
            display: block;
            width: 100%;
            height: 700px;
            border: none;
            background: black;
        }

        .game-title {
            color: #a78bfa;
            margin-top: 25px;
            margin-bottom: 10px;
        }

        .game-info {
            margin-top: 10px;
            background: #201f38;
            padding: 22px;
            border-radius: 12px;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin: 0 8px;
                font-size: 14px;
            }

            .game-iframe {
                height: 450px;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="index.html" class="logo">🎮 SQUISHLISH</a>

    <nav>
        <a href="index.html">Home</a>
        <a href="library.html">Games</a>
        <a href="arcade.html">Arcade Games</a>
    </nav>
</header>

<div class="container">

    <div class="game-controls">
        <button class="fullscreen-btn" onclick="toggleFullscreen()">
            ⛶ Fullscreen
        </button>
    </div>

    <div class="game-window" id="gameWindow">

        <iframe
            class="game-iframe"
            loading="lazy"
            id="game-area"
            src="https://gamecdn.onl/proxy/5dd30ab4-015f-11ea-ad56-9cb6d0d995f7.poki-gdn.com/a9b6d9fd-0b47-4682-9649-0e95c2d95625/index.html"
            scrolling="no"
            frameborder="0"
            allowfullscreen
            onload="this.focus();">
        </iframe>

    </div>

    <h1 class="game-title">Stickman Hook</h1>

    <div class="game-info">
        <p>
            Swing through challenging levels, master your momentum and reach the finish line!
        </p>
    </div>

</div>

<script>
function toggleFullscreen() {
    const game = document.getElementById("gameWindow");

    if (!document.fullscreenElement) {
        game.requestFullscreen();
    } else {
        document.exitFullscreen();
    }
}
</script>

</body>
</html>
