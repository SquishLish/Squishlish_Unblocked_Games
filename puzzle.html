
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Games | Squishlish</title>

    <style>
        body {
            margin: 0;
            background: #0f1020;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 20px 5%;
            background: #19182e;
        }

        header a {
            color: #a78bfa;
            text-decoration: none;
            font-weight: bold;
        }

        main {
            padding: 40px 5%;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, 270px);
            gap: 25px;
        }

        .game-card {
            display: block;
            width: 240px;
            padding: 15px;
            background: #201f38;
            border-radius: 14px;
            color: white;
            text-decoration: none;
            transition: transform 0.2s;
        }

        .game-card:hover {
            transform: translateY(-5px);
        }

        .game-card img {
            width: 100%;
            border-radius: 10px;
        }

        .game-card h2 {
            margin-bottom: 5px;
        }

        @media (max-width: 600px) {
            .game-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            }

            .game-card {
                width: auto;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="index.html">🎮 SQUISHLISH</a>
</header>

<main>
    <h1>🧩 Puzzle Games</h1>
    <p>Explore our collection of puzzle games!</p>

    <div class="game-grid">

        <a href="level-devil.html" class="game-card">
            <img src="images/level-devil.png"
                 alt="Level Devil game thumbnail">

            <h2>Level Devil</h2>
            <p>A tricky platform game full of surprises!</p>
        </a>

        <a href="fireboy-watergirl.html" class="game-card">
            <img src="images/fireboy-watergirl.png"
                 alt="Fireboy and Watergirl game thumbnail">

            <h2>Fireboy and Watergirl</h2>
            <p>Work together to solve puzzles and escape the Forest Temple!</p>
        </a>

    </div>

</main>

</body>
</html>
