
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fireboy and Watergirl | Squishlish</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111126;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: #191932;
            border-bottom: 1px solid #383653;
        }

        .logo {
            color: #a78bfa;
            font-size: 21px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 15px;
        }

        nav a:hover {
            color: #a78bfa;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .game-controls {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 12px;
        }

        .game-controls button {
            background: #242440;
            color: white;
            border: 1px solid #383653;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .game-controls button:hover {
            background: #a78bfa;
            color: #111126;
        }

        .game-window {
            width: 100%;
            background: #000;
            border: 1px solid #383653;
            border-radius: 12px;
            overflow: hidden;
        }

        .game-window iframe {
            display: block;
            width: 100%;
            height: 600px;
            border: none;
        }

        .game-info {
            margin-top: 30px;
        }

        .game-info h1 {
            color: #a78bfa;
            font-size: 32px;
            margin-bottom: 12px;
        }

        .game-info p {
            color: #c5c5d8;
            font-size: 16px;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            header {
                padding: 18px 20px;
            }

            .game-window iframe {
                height: 400px;
            }

            .game-info h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <header>
        <a href="index.html" class="logo">🎮 SQUISHLISH</a>

        <nav>
            <a href="index.html">Home</a>
            <a href="library.html">Games</a>
        </nav>
    </header>

    <main class="container">

        <div class="game-controls">
            <button onclick="toggleFullscreen()">⛶ Fullscreen</button>
        </div>

        <div class="game-window" id="gameWindow">
            <iframe
                class="game-iframe"
                id="gameFrame"
                src="https://tyronegames.gitlab.io/fireboy-and-watergirl-1-forest-temple/"
                title="Fireboy and Watergirl"
                allow="fullscreen"
                allowfullscreen
                style="background: black;"
                scrolling="no">
            </iframe>
        </div>

        <section class="game-info">
            <h1>Fireboy and Watergirl: Forest Temple</h1>

            <p>
                Team up with Fireboy and Watergirl in the Forest Temple!
                Solve puzzles, overcome obstacles and work together
                to reach the exit. Each character has unique abilities,
                so you'll need both of them to complete the levels!
            </p>
        </section>

    </main>

    <script>
        function toggleFullscreen() {
            const game = document.getElementById("gameWindow");

            if (!document.fullscreenElement) {
                game.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }
    </script>

</body>
</html>
