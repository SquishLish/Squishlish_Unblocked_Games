
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Impossible Quiz | Squishlish</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111126;
            color: white;
        }

        header {
            background: #1c1b35;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #a78bfa;
            font-size: 21px;
            font-weight: bold;
            text-decoration: none;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 15px;
        }

        nav a:hover {
            color: #a78bfa;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        h1 {
            color: #c4b5fd;
            margin-bottom: 10px;
        }

        .game-container {
            background: #242440;
            padding: 15px;
            border-radius: 14px;
            margin-top: 20px;
        }

        .game-iframe {
            display: block;
            width: 100%;
            height: 650px;
            border: none;
            border-radius: 10px;
            background: black;
        }

        .fullscreen-button {
            display: block;
            margin-top: 15px;
            padding: 12px 20px;
            background: #7954db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }

        .fullscreen-button:hover {
            background: #906ff0;
        }

        @media (max-width: 600px) {
            header {
                padding: 15px;
                flex-direction: column;
                gap: 12px;
            }

            nav a {
                margin: 0 8px;
            }

            .game-iframe {
                height: 500px;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="index.html" class="logo">🎮 SQUISHLISH</a>

    <nav>
        <a href="index.html">Home</a>
        <a href="library.html">Games</a>
        <a href="puzzle.html">Puzzle</a>
    </nav>
</header>

<main>
    <h1>The Impossible Quiz</h1>
    <p>Answer bizarre questions, think outside the box and try not to lose your mind!</p>

    <div class="game-container" id="gameContainer">
        <iframe
            id="gameFrame"
            class="game-iframe"
            src="https://db.duckmath.org/html/theimpossiblequiz/index.html"
            title="The Impossible Quiz"
            allow="autoplay; fullscreen"
            allowfullscreen
            loading="eager"
            scrolling="no">
        </iframe>

        <button class="fullscreen-button" onclick="goFullscreen()">
            ⛶ Fullscreen
        </button>
    </div>
</main>

<script>
    function goFullscreen() {
        const game = document.getElementById("gameFrame");

        if (game.requestFullscreen) {
            game.requestFullscreen();
        } else if (game.webkitRequestFullscreen) {
            game.webkitRequestFullscreen();
        }
    }
</script>

</body>
</html>
